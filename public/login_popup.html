<!DOCTYPE html>
<html lang="en">

<head>
    <title>Authentication callback processing..</title>
</head>

<body>
    <h1>Authenticating...</h1>
    <p id="status"></p>

    <script>
        // This page receives an OAuth authorization code in its url and hands it
        // to the window that opened it. Who that window is decides who gets the
        // code, so it is named exactly rather than left as "*".
        //
        // The target is this page's own origin because that is always the app's:
        // the plugin builds its redirect uri from the host's origin, and the host
        // is what opened this popup. Deriving it beats an allowlist -- production,
        // preview and a local dev server are all correct without being listed,
        // and none of them can drift out of date.
        //
        // With "*" any page could run this flow, catch the code in its own opener
        // and redeem it. Naming the origin means a page on another origin receives
        // nothing at all.
        //
        // It fails closed on purpose: if the opener is somewhere else, sign-in
        // does not complete rather than the code going somewhere it shouldn't.
        const status = document.getElementById("status");
        const data = { url: window.location.href };
        let delivered = false;

        // A BroadcastChannel reaches the app whether or not this window still
        // has an opener. Opener is easy to lose -- a popup the browser blocked
        // and the user then allowed is reopened without one, and some providers
        // sever it on the way through -- and losing it used to mean sign-in
        // simply never completed, with this page sitting on "Authenticating..."
        // forever. A channel is same-origin by definition, so it carries the
        // same guarantee as naming the origin below.
        try {
            const channel = new BroadcastChannel("socialgata-oauth");
            channel.postMessage(data);
            channel.close();
            delivered = true;
        } catch (e) {
            // No BroadcastChannel: fall through to the opener.
        }

        // Kept as well, so nothing that already worked stops working.
        if (window.opener) {
            window.opener.postMessage(data, window.location.origin);
            delivered = true;
        }

        status.textContent = delivered
            ? "You can close this window."
            : "Sign-in couldn't be handed back to the app. Please try again from the app.";
    </script>

</body>

</html>
